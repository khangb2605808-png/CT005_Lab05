<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lợi ích của công nghệ số trong học tập</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			padding: 32px 16px;
			background: #f3f8fc;
			color: #183653;
			font-family: Arial, Helvetica, sans-serif;
		}
		main { width: min(100%, 900px); margin: 0 auto; }
		h1 { margin: 0 0 24px; text-align: center; font-size: clamp(1.5rem, 4vw, 2.4rem); }
		figure, .video {
			margin: 0 0 28px;
			overflow: hidden;
			border: 1px solid #d7e5ed;
			border-radius: 14px;
			background: #fff;
			box-shadow: 0 6px 20px rgb(23 53 83 / 10%);
		}
		figure img { display: block; width: 100%; height: auto; }
		.video { aspect-ratio: 16 / 9; }
		.video iframe { display: block; width: 100%; height: 100%; border: 0; }
	</style>
</head>
<body>
	<main>
		<h1>Lợi ích của công nghệ số trong học tập</h1>
		<figure>
			<img src="26-27hk1-ct005d06-labs-khangb2605808-png/lab05/Lab05_Ex2.1.png" alt="Infographic về lợi ích của công nghệ số trong học tập: tiếp cận học liệu, học tập linh hoạt, tăng tương tác, cá nhân hóa và kết nối cộng đồng.">
		</figure>
		<section class="video" aria-label="Video YouTube">
			<iframe
				src="https://www.youtube.com/embed/yHbciai95Xw"
				title="Video về công nghệ số trong học tập"
				allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
				referrerpolicy="strict-origin-when-cross-origin"
				allowfullscreen>
			</iframe>
		</section>
	</main>
</body>
</html>
